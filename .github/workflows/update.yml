name: Check & Update Upstream

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update.yml
      - scripts/**
      - tests/**
  schedule:
    - cron: '0 6 * * *' # Daily at 11:30 AM IST (06:00 UTC)
  workflow_dispatch:

concurrency:
  group: upstream-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      publish_required: ${{ steps.check.outputs.has_update == 'true' || github.event_name == 'push' }}
      candidate_artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable user namespaces for the runtime sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install headless desktop test tools
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth dbus-x11

      - name: Test update selection
        run: python3 -m unittest discover -s tests -v

      - name: Refresh official Nixpkgs pin on the first Monday of the month
        run: |
          set -euo pipefail
          if (( 10#$(date -u +%d) <= 7 )); then
            nix flake update nixpkgs
          fi

      - name: Check official Google download page and update pin
        id: check
        run: python3 scripts/update.py --candidate candidate.json --include-lock

      - name: Capture immutable candidate metadata
        id: candidate
        if: steps.check.outputs.has_update == 'true' || github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: candidate.json
          if-no-files-found: error
          retention-days: 7

      - name: Check Nix formatting
        run: nix fmt -- --check *.nix

      - name: Check flake, updater, and desktop integration
        run: nix flake check --print-build-logs

      - name: Build package
        run: nix build .#default --print-build-logs

      - name: Check packaged desktop entry and assets
        run: nix shell --inputs-from . nixpkgs#python3 nixpkgs#desktop-file-utils -c python3 scripts/check-desktop.py ./result

      - name: Check packaged runtime
        run: bash scripts/check-runtime.sh

      - name: Report validation failure
        if: failure()
        run: echo '## Update blocked — validation failed; no package update was published. See the failed step above.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: update
    if: needs.update.result == 'success' && needs.update.outputs.publish_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the exact validated base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download validated metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.update.outputs.candidate_artifact_id }}
          merge-multiple: true
          path: candidate

      - name: Verify push access without changing the repository
        run: git push --dry-run origin HEAD:main

      - name: Apply audited package and Nixpkgs pins
        id: apply
        run: python3 scripts/update.py --apply-candidate candidate/candidate.json

      - name: Commit and push validated update
        env:
          NEW_VERSION: ${{ steps.apply.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.nix flake.lock
          git diff --cached --exit-code --quiet && exit 0
          git commit -m "chore(deps): validate v${NEW_VERSION} and refresh package pins"
          git push origin HEAD:main
